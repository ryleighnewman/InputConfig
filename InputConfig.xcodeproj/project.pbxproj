			shellPath = /bin/sh;
			shellScript = "# Sign embedded helpers with their own entitlements: app-sandbox + inherit,\n# nothing else, so each runs inside the app's sandbox when the app launches it.\n# The Copy Helpers phase brings in pre-built helper binaries that Xcode\n# signs without entitlements by default, which fails App Store validation\n# (\"App sandbox not enabled\"). This phase re-signs each helper with its\n# entitlements file. Xcode's implicit outer-bundle sign that runs after\n# this phase preserves these nested signatures.\n\nset -e\n\nAPP=\"${CODESIGNING_FOLDER_PATH}\"\n# Respect a build that turns signing off, and sign only with the identity\n# Xcode resolved: the bare CODE_SIGN_IDENTITY name matched whatever\n# certificate came first in the keychain.\nif [ \"${CODE_SIGNING_ALLOWED}\" = \"NO\" ]; then\n  echo \"Code signing is off for this build; skipping helper signing.\"\n  exit 0\nfi\nIDENTITY=\"${EXPANDED_CODE_SIGN_IDENTITY}\"\n\nif [ -z \"$IDENTITY\" ] || [ \"$IDENTITY\" = \"-\" ]; then\n  # A Release build (the archive) must not ship the helper without its\n  # sandbox entitlements: App Store validation rejects it, and the helper\n  # traps at launch.\n  if [ \"${CONFIGURATION}\" = \"Release\" ]; then\n    echo \"error: No code signing identity for a Release build; the helper would ship unsigned.\"\n    exit 1\n  fi\n  echo \"warning: No code signing identity, skipping helper signing.\"\n  exit 0\nfi\n\nsign_helper() {\n  local name=\"$1\"\n  local ents=\"$2\"\n  local target=\"$APP/Contents/MacOS/$name\"\n  if [ ! -f \"$target\" ]; then\n    if [ \"${CONFIGURATION}\" = \"Release\" ]; then\n      echo \"error: $name not found at $target\"\n      exit 1\n    fi\n    echo \"warning: $name not found at $target\"\n    return\n  fi\n  if [ ! -f \"$ents\" ]; then\n    echo \"error: entitlements file not found: $ents\"\n    exit 1\n  fi\n  xattr -cr \"$target\" || true\n  /usr/bin/codesign --force --options runtime \\\n    --sign \"$IDENTITY\" \\\n    --entitlements \"$ents\" \\\n    \"$target\"\n  echo \"Signed $name with entitlements\"\n}\n\nsign_helper SteamControllerHelper \"${SRCROOT}/SteamControllerHelper/SteamControllerHelper.entitlements\"\n";
